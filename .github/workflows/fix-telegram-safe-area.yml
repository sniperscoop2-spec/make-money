name: Telegram safe-area regression fix
on:
  push:
    branches: [telegram-mini-app]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram-mini-app
          fetch-depth: 0
      - name: Patch Telegram safe area
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('popup.css')
          s = p.read_text()
          marker = '/* TELEGRAM_SAFE_AREA_V1 */'
          if marker not in s:
              s += '''\n/* TELEGRAM_SAFE_AREA_V1 */\nhtml,body{padding-top:max(var(--tg-content-safe-area-inset-top,0px),env(safe-area-inset-top,0px));padding-bottom:max(var(--tg-content-safe-area-inset-bottom,0px),env(safe-area-inset-bottom,0px));padding-left:max(var(--tg-content-safe-area-inset-left,0px),env(safe-area-inset-left,0px));padding-right:max(var(--tg-content-safe-area-inset-right,0px),env(safe-area-inset-right,0px))}.app{min-height:calc(100dvh - var(--tg-content-safe-area-inset-top,0px) - var(--tg-content-safe-area-inset-bottom,0px))}\n'''
              p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add popup.css
          git commit -m 'fix Telegram content safe area overlap'
          git push origin HEAD:telegram-mini-app
