name: Load market UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          css = Path('popup.css')
          html = index.read_text(encoding='utf-8')
          styles = css.read_text(encoding='utf-8')

          # Existing market fix.
          tag = '<script src="market-ui-fix.js"></script>'
          if tag not in html:
              marker = '<script src="popup.js"></script>'
              if marker in html:
                  html = html.replace(marker, marker + '\n' + tag, 1)
              else:
                  html = html.replace('</body>', tag + '\n</body>', 1)

          # The old logo asset was intentionally removed. Remove stale references
          # so the browser never renders broken-image placeholders.
          html = html.replace('    <div class="auth-logo-large"><img src="icons/make-money-logo.png" alt="Make Money"></div>\n', '')
          html = html.replace('      <div class="brand-icon"><img src="icons/make-money-logo.png" alt="Make Money"></div>\n      ', '')

          # Make Money title: plain text, Impact-style fallback, always above the app header.
          marker = '<div class="app">'
          title = '<div class="top-app-title" aria-label="MAKE MONEY">MAKE MONEY</div>\n\n'
          if 'class="top-app-title"' not in html:
              if marker not in html:
                  raise SystemExit('FAIL: app root marker not found')
              html = html.replace(marker, title + marker, 1)

          css_marker = '.app{min-height:620px;display:flex;flex-direction:column}'
          css_rule = '.top-app-title{min-height:58px;display:flex;align-items:center;justify-content:center;padding:10px 14px 8px;background:#0d131e;color:#f7f9fc;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:30px;line-height:1;letter-spacing:2px;text-align:center;border-bottom:1px solid var(--border);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
          if '.top-app-title{' not in styles:
              if css_marker not in styles:
                  raise SystemExit('FAIL: CSS app marker not found')
              styles = styles.replace(css_marker, css_marker + css_rule, 1)

          index.write_text(html, encoding='utf-8')
          css.write_text(styles, encoding='utf-8')
          PY

      - name: Structural, security and syntax tests
        run: |
          set -euo pipefail
          test -f index.html
          test -f popup.css
          test -f telegram-app.js
          grep -q 'class="top-app-title"' index.html
          grep -q 'font-family:Impact' popup.css
          ! grep -q 'icons/make-money-logo.png' index.html
          ! grep -RIn --exclude-dir=.git -E 'service_role|SUPABASE_SERVICE_ROLE_KEY|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----' .
          ! grep -RIn --exclude-dir=.git -E '<script[^>]+src="http://|href="http://' index.html popup.css telegram-app.js
          node --check telegram-app.js
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Parser(HTMLParser):
              pass

          Parser().feed(Path('index.html').read_text(encoding='utf-8'))
          print('HTML parser: OK')
          print('Title count:', Path('index.html').read_text(encoding='utf-8').count('class="top-app-title"'))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html popup.css
          git diff --cached --quiet || git commit -m 'fix: remove stale logo references and verify title'
          git push
