name: Load market UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          css = Path('popup.css')
          html = index.read_text(encoding='utf-8')
          styles = css.read_text(encoding='utf-8')

          # Keep the existing market UI fix.
          tag = '<script src="market-ui-fix.js"></script>'
          if tag not in html:
              marker = '<script src="popup.js"></script>'
              if marker in html:
                  html = html.replace(marker, marker + '\n' + tag, 1)
              else:
                  html = html.replace('</body>', tag + '\n</body>', 1)

          # The old logo asset was intentionally removed.
          html = html.replace('    <div class="auth-logo-large"><img src="icons/make-money-logo.png" alt="Make Money"></div>\n', '')
          html = html.replace('      <div class="brand-icon"><img src="icons/make-money-logo.png" alt="Make Money"></div>\n      ', '')

          # Remove every previous title instance, then put ONE real title immediately
          # after <body>. This makes it visible on login, ranking and the main app.
          title = '<div class="top-app-title" aria-label="MAKE MONEY">MAKE MONEY</div>\n'
          while title.strip() in html:
              html = html.replace(title, '', 1)
          html = html.replace('<div class="top-app-title" aria-label="MAKE MONEY">MAKE MONEY</div>\n', '', 1)
          body_marker = '<body>\n'
          if body_marker not in html:
              raise SystemExit('FAIL: body marker not found')
          html = html.replace(body_marker, body_marker + title, 1)

          # Strong, visible Impact-style title. Sticky keeps it at the top while screens scroll.
          import re
          styles = re.sub(r'\.top-app-title\{[^}]*\}', '', styles, count=1)
          css_rule = '.top-app-title{position:sticky;top:0;z-index:100000;min-height:58px;display:flex;align-items:center;justify-content:center;padding:10px 14px 8px;background:#0d131e;color:#f7f9fc;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:30px;line-height:1;letter-spacing:2px;text-align:center;border-bottom:1px solid var(--border);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
          styles = styles.replace('button{font:inherit}', 'button{font:inherit}\n' + css_rule, 1)

          index.write_text(html, encoding='utf-8')
          css.write_text(styles, encoding='utf-8')
          PY

      - name: Structural, security and syntax tests
        run: |
          set -euo pipefail
          test -f index.html
          test -f popup.css
          test -f telegram-app.js
          grep -q 'class="top-app-title"' index.html
          grep -q 'font-family:Impact' popup.css
          grep -q 'position:sticky' popup.css
          test "$(grep -o 'class=\"top-app-title\"' index.html | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html = Path('index.html').read_text(encoding='utf-8')
          Parser = HTMLParser
          Parser().feed(html)
          assert html.index('class="top-app-title"') < html.index('<div id="authScreen"'), 'Title is not above auth screen'
          assert 'MAKE MONEY' in html
          print('HTML parser: OK')
          print('Title location: OK - before auth screen')
          PY
          ! grep -q 'icons/make-money-logo.png' index.html
          ! grep -RIn --exclude-dir=.git -E 'service_role|SUPABASE_SERVICE_ROLE_KEY|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----' .
          ! grep -RIn --exclude-dir=.git -E '<script[^>]+src="http://|href="http://' index.html popup.css telegram-app.js
          node --check telegram-app.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html popup.css
          git diff --cached --quiet || git commit -m 'fix: force Make Money title to top of every screen'
          git push
