<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080c13">
<title>Make Money</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="telegram.css">
</head>
<body>
<main class="app">
  <div class="brand">MAKE MONEY</div>
  <div class="card" id="statusCard">
    <div id="spinner" class="spinner"></div>
    <h1 id="title">Connecting...</h1>
    <p id="message">Checking your Telegram identity securely.</p>
  </div>
  <section class="profile card" id="profile" hidden>
    <div class="avatar" id="avatar">*</div>
    <h2 id="name">Player</h2>
    <p id="username"></p>
    <div class="balance"><strong id="balance">0</strong> MM</div>
    <div class="badge">Telegram account verified</div>
  </section>
  <section class="mining card" id="mining" hidden>
    <div class="section-title">⛏️ Mining</div>
    <p id="miningStatus">Your miner is ready.</p>
    <div class="mining-stat"><span>Available</span><strong id="miningReward">0 MM</strong></div>
    <div class="mining-stat"><span>Next claim</span><strong id="nextClaim">Ready</strong></div>
    <button id="claimMining" type="button">Claim MM</button>
  </section>
</main>
<script src="telegram-app.js"></script>
</body>
</html>
